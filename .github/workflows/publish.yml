name: Publish to PyPI

# Triggered when a git tag matching v* is pushed.
# Uses PyPI Trusted Publisher (OIDC) — no API token needed.
# Setup on PyPI side: https://pypi.org/manage/project/stateprobe/settings/publishing/

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stateprobe/
    permissions:
      id-token: write  # Required for PyPI Trusted Publisher (OIDC).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + twine
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify artifacts
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
